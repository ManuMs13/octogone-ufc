name: iOS - Build & envoi TestFlight

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sélectionner la dernière version d'Xcode (SDK iOS le plus récent)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances npm
        run: npm install

      - name: Ajouter la plateforme iOS (Capacitor)
        run: npx cap add ios

      - name: Générer l'icône et le splash screen
        run: npx capacitor-assets generate --ios

      - name: Synchroniser Capacitor
        run: npx cap sync ios

      - name: Déclarer l'app exempte de conformité export (HTTPS standard uniquement)
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      # Sans ces deux textes, iOS ferme l'app quand l'utilisateur choisit une
      # photo de profil (bouton « Importer une photo » de l'éditeur de profil).
      - name: Déclarer l'usage de la caméra et de la photothèque
        run: |
          set -e
          P=ios/App/App/Info.plist
          CAM="Pour prendre une photo de profil, uniquement si vous le demandez. L'image reste sur votre appareil."
          LIB="Pour choisir une photo de profil dans vos photos, uniquement si vous le demandez. L'image reste sur votre appareil."
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string $CAM" "$P" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription $CAM" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string $LIB" "$P" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription $LIB" "$P"
          echo "--- Vérification ---"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$P"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$P"

      # Les notifications push exigent l'entitlement aps-environment. Le projet
      # iOS étant régénéré à chaque build, on l'ajoute ici plutôt que dans Xcode.
      - name: Activer les notifications push (entitlement APNs)
        run: |
          set -e
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          PLIST
          gem install xcodeproj -N --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target  = project.targets.find { |t| t.name == "App" } or abort("cible App introuvable")
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            project.save
            puts "CODE_SIGN_ENTITLEMENTS positionné sur #{target.build_configurations.map(&:name).join(", ")}"
          '
          echo "--- Entitlements ---"
          cat ios/App/App/App.entitlements

      - name: Installer les pods CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Importer le certificat de distribution
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Installer le profil de provisionnement
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/octogone-appstore.mobileprovision

      - name: Installer Fastlane
        run: gem install fastlane -N

      - name: Générer un numéro de build unique (précision à la seconde)
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Compiler et envoyer sur TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.octogone.ufc
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: fastlane release

      - name: Archiver les logs Fastlane en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: ~/Library/Logs/gym
